apiVersion: v1
kind: Namespace
metadata:
  name: appliance
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: appliance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appliance-backend
  template:
    metadata:
      labels:
        app: appliance-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: appliance-energy-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          env:
            - name: MQTT_CA_CERT
              value: /certs/ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: broker-ca
              mountPath: /certs
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: broker-ca
          configMap:
            name: broker-ca
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: appliance
spec:
  type: ClusterIP
  selector:
    app: appliance-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
