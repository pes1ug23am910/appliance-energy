[project]
name = "appliance-energy-analytics"
version = "0.1.0"
description = "Reproducible telemetry quality, energy accounting and forecast evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==1.3.2",
  "numpy==2.2.6",
  "pandas==2.3.0",
  "mlflow-skinny==3.1.1",
  "sqlglot==26.33.0",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[project.scripts]
appliance-analytics = "appliance_analytics.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/appliance_analytics"]
