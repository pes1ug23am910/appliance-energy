name: Verify software edition
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.8.22'
      - run: uv sync --project analytics --locked --python 3.12
      - run: uv run --project analytics --locked pytest analytics/tests -q
      - run: uv sync --project simulator --locked --python 3.12
      - run: uv run --project simulator --locked pytest simulator/tests -q
      - run: uv run --project simulator --locked pytest scripts/tests -q
      - run: uv run --project simulator --locked python scripts/test_dashboard.py
      - run: python firmware/scripts/test_tls_config.py
      - run: python firmware/scripts/test_spool.py
      - run: python firmware/esp8266/scripts/test_desired.py
      - run: python scripts/azure_test.py
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_DB: appliance_test
          POSTGRES_USER: appliance
          POSTGRES_PASSWORD: appliance-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appliance -d appliance_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/appliance_test
      TEST_DATABASE_USERNAME: appliance
      TEST_DATABASE_PASSWORD: appliance-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f backend/pom.xml verify
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --timeout 40s
      - run: dart run sqflite_common_ffi_web:setup
      - run: flutter build web --release --no-web-resources-cdn
  transports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.8.22'
      - run: uv sync --project simulator --locked --python 3.12
      - run: uv run --project simulator --locked python scripts/bootstrap.py --devices 2
      - run: docker compose up -d --build --wait
      - name: Wait for API
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/devices || true)
            if [ "$status" = 401 ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: uv run --project simulator --locked python scripts/with_env.py uv run --project simulator --locked python scripts/smoke.py
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native command persistence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          ram-size: 2048M
          working-directory: mobile
          ndk: 28.2.13676358
          script: flutter test integration_test/native_store_test.dart -d emulator-5554 --timeout 5m
      - run: flutter build apk --debug --target-platform android-arm64,android-x64
