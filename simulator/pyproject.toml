[project]
name = "appliance-simulator"
version = "0.1.0"
description = "Persistent appliance simulator, fleet runner and telemetry batch exporter"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3", "kafka-python>=2.2,<3", "httpx>=0.28,<1", "cryptography>=44,<48"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
appliance-simulator = "appliance_simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
